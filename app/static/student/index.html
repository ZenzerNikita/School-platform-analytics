<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Интерфейс ученика</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <link rel="stylesheet" href="/static/assets/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

<body>
<div class="container">
  <div class="card">
    <div class="tabs-wrapper">
      <div class="tabs-row">
        <button class="tab-btn active" data-tab="summary">📖 Конспект</button>
        <button class="tab-btn" data-tab="quiz">❓ Тест</button>
      </div>
    </div>

    <div id="panelSummary" class="content-pane active-pane">
      <div id="summaryContainer"></div>

    <div id="panelQuiz" class="content-pane">
      <div id="quizContainer"></div>
    </div>
  </div>
